<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17112a">
<title>DJ Maison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout : une seule colonne façon platine — un disque en tête, une carte d'action, des boutons larges pour le pouce */
:root{
  --bg:#17112a; --bg2:#221a3b; --card:#2b2249; --line:#3d3263;
  --fg:#f4eefc; --muted:#b4a8d2; --accent:#ff8a5c; --accent-ink:#2a1208;
  --ok:#7fe0b0; --gold:#ffd166;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 32px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.5rem}
h2{font-size:1.25rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;cursor:pointer;border:none;border-radius:14px;padding:14px 16px;font-weight:700;min-height:52px;color:var(--fg);background:var(--bg2);border:1px solid var(--line)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
button.ghost{background:transparent}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
a.spot{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;background:#1ed760;color:#08240f;font-weight:800;border-radius:14px;min-height:56px;padding:14px;font-size:1.05rem}
input[type=text]{font:inherit;width:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px}

/* tête : disque vinyle */
.top{display:flex;align-items:center;gap:14px}
.vinyl{width:56px;height:56px;flex:none;border-radius:50%;
  background:radial-gradient(circle,var(--accent) 0 17%,var(--bg) 18% 21%,#0d0918 22% 100%);
  box-shadow:inset 0 0 0 2px #2d2450, inset 0 0 0 9px #0d0918, inset 0 0 0 10px #241c3f, inset 0 0 0 16px #0d0918, inset 0 0 0 17px #241c3f}
.spin .vinyl{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin .vinyl{animation:none}}

/* scores */
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.score{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.score b{font-family:var(--display);font-size:1.05rem;overflow-wrap:anywhere}
.score .sets{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700}
.score .pts{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}

/* progression 7 titres */
.track{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.track span{height:8px;border-radius:4px;background:var(--line)}
.track span.done{background:var(--accent)}
.track span.now{background:var(--gold)}

.answer{background:var(--bg);border:1px dashed var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.answer .big{font-family:var(--display);font-size:1.35rem;color:var(--gold)}
.song{font-weight:700}

.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.themes button{min-height:64px;text-align:left;font-weight:600;display:flex;flex-direction:column;gap:2px;justify-content:center}
.themes button small{font-weight:500;color:var(--muted)}
.themes button.played{opacity:.5}
.themes button.played small::after{content:" · déjà joué"}

.teamlist{display:flex;flex-direction:column;gap:8px}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.win{font-family:var(--display);font-size:1.6rem;color:var(--gold);text-align:center}
.center{text-align:center}
.small{font-size:.88rem}

.spotbtn{background:#1ed760;color:#08240f;border-color:transparent;font-size:1.05rem;min-height:56px}
.msg{min-height:1.4em;color:var(--ok);font-weight:600}
.msg.bad{color:#ff8f8f}
.okline{color:var(--ok);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:6px 12px;border-radius:999px;font-weight:600;font-size:.88rem}
.chip.on{background:var(--gold);color:#2a1208;border-color:transparent}
.themes button small.pubs{font-size:.75rem;opacity:.8}
.themes button.played small::after{content:none}
.themes button.played{opacity:.5}
.hints{display:flex;flex-direction:column;gap:8px}
a.spotlink{display:flex;align-items:center;justify-content:center;text-decoration:none;background:#1ed760;color:#08240f;font-weight:800;border-radius:14px;min-height:52px;padding:12px}
.hintbtn{background:transparent;border:1px dashed var(--gold);color:var(--gold)}
.hint{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-weight:600}
</style>
</head>

const DECS=[["50","Avant 1960",0,1959],["60","Années 60",1960,1969],["70","Années 70",1970,1979],["80","Années 80",1980,1989],["90","Années 90",1990,1999],["00","Années 2000",2000,2009],["10","2010 et après",2010,9999]];
const DEC_SHORT={"50":"avant 60","60":"60s","70":"70s","80":"80s","90":"90s","00":"2000s","10":"2010s+"};
const PUBS=[["","Tous"],["E","Enfants"],["A","Ados"],["D","Adultes"]];
const PUB_NAME={E:"Enfants",A:"Ados",D:"Adultes"};
const decOf=y=>DECS.find(d=>y>=d[2]&&y<=d[3])[0];
THEMES.forEach(t=>{
  t.dec=t.s.map(s=>decOf(s[6]));
  t.fr=t.s.filter(s=>s[7]==="fr").length;
  t.en=t.s.filter(s=>s[7]==="en").length;
  const order=DECS.map(d=>d[0]), main=order.filter(k=>t.dec.filter(x=>x===k).length>=2);
  const use=main.length?main:[...new Set(t.dec)].sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  t.span=use.length===1?DEC_SHORT[use[0]]:DEC_SHORT[use[0]]+" – "+DEC_SHORT[use[use.length-1]];
});
function themeMatch(t,f){
  if(f.pub && !t.pub.includes(f.pub)) return false;
  if(f.lang==="fr" && t.fr<4) return false;
  if(f.lang==="en" && t.en<4) return false;
  if(f.dec && f.dec.length && t.dec.filter(d=>f.dec.includes(d)).length<4) return false;
  return true;
}

/* ---------- Indices à la demande ---------- */
function drawHints(){
  const box=document.getElementById("hints"); if(!box) return;
  if(S.screen!=="play"||S.revealed){ box.innerHTML=""; return; }
  const song=THEMES[S.theme].s[S.idx], n=S.h||0;
  let html="";
  if(n>=1) html+=`<div class="hint"><span class="eyebrow">Indice 1</span><span>${esc(HINT1[song[4]]||"")}</span></div>`;
  if(n>=2) html+=`<div class="hint"><span class="eyebrow">Indice 2</span><span>${esc(song[5]||"")}</span></div>`;
  if(n<2) html+=`<button class="hintbtn" id="hintb">💡 Indice ${n+1}</button>`;
  box.innerHTML=html;
  const b=document.getElementById("hintb");
  if(b) b.onclick=()=>{ S.h=(S.h||0)+1; save(); drawHints(); };
}

const CLIENT_ID = "6b2284bb0701478f9eb22fbd5e5b5134";
const REDIRECT = location.origin + location.pathname;
const SCOPES = "user-read-playback-state user-modify-playback-state streaming user-read-email user-read-private";
const ls = {
  get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
  del:k=>{try{localStorage.removeItem(k)}catch(e){}}
};
function rnd(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,b=>("0"+b.toString(16)).slice(-2)).join("")}
async function pkce(v){const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v));return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}

async function spLogin(){
  const v=rnd(48); ls.set("sp_verifier",v);
  const p=new URLSearchParams({client_id:CLIENT_ID,response_type:"code",redirect_uri:REDIRECT,scope:SCOPES,code_challenge_method:"S256",code_challenge:await pkce(v)});
  location.href="https://accounts.spotify.com/authorize?"+p;
}
function saveTok(j){
  ls.set("sp_token",j.access_token);
  ls.set("sp_exp",String(Date.now()+(j.expires_in-60)*1000));
  if(j.refresh_token) ls.set("sp_refresh",j.refresh_token);
  if(j.scope) ls.set("sp_scope",j.scope);
}
const hasStreaming=()=>(ls.get("sp_scope")||"").split(" ").includes("streaming");
async function tokenCall(params){
  const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(params)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description||j.error||("erreur "+r.status));
  saveTok(j);
}
async function spReturn(){
  const q=new URLSearchParams(location.search);
  if(!q.get("code") && !q.get("error")) return;
  history.replaceState(null,"",REDIRECT);
  if(q.get("error")){ flash="Connexion refusée par Spotify."; return; }
  try{
    await tokenCall({client_id:CLIENT_ID,grant_type:"authorization_code",code:q.get("code"),redirect_uri:REDIRECT,code_verifier:ls.get("sp_verifier")||""});
    flash="Connecté à Spotify.";
  }catch(e){ flash="Échec de la connexion : "+e.message; }
}
async function getToken(){
  const t=ls.get("sp_token"), exp=+ls.get("sp_exp");
  if(t && Date.now()<exp) return t;
  const rt=ls.get("sp_refresh");
  if(!rt) return null;
  try{ await tokenCall({client_id:CLIENT_ID,grant_type:"refresh_token",refresh_token:rt}); return ls.get("sp_token"); }
  catch(e){ ls.del("sp_token"); ls.del("sp_refresh"); return null; }
}
const connected=()=>!!(ls.get("sp_refresh")||ls.get("sp_token"));
function spLogout(){["sp_token","sp_exp","sp_refresh","sp_scope"].forEach(ls.del); if(sdkPlayer){try{sdkPlayer.disconnect()}catch(e){} sdkPlayer=null; sdkId=null;}}

async function api(method,path,body){
  const t=await getToken();
  if(!t) return {status:401,ok:false,json:{error:{message:"Pas connecté à Spotify."}}};
  const r=await fetch("https://api.spotify.com/v1"+path,{method,headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  let j=null; try{j=await r.json()}catch(e){}
  return {status:r.status,ok:r.ok,json:j};
}

async function findTrack(artist,title){
  const key="uri|"+artist+"|"+title, cached=ls.get(key);
  if(cached) return cached;
  const mainArtist=artist.split(/&| feat\.? | et /i)[0].trim();
  const queries=[`track:"${title}" artist:"${mainArtist}"`, `${title} ${mainArtist}`, title];
  const want=norm(mainArtist).split(" ")[0];
  for(const qy of queries){
    const r=await api("GET","/search?"+new URLSearchParams({q:qy,type:"track",limit:"10"}));
    if(!r.ok) throw r;
    const items=r.json?.tracks?.items||[];
    if(!items.length) continue;
    const good=items.find(it=>it.artists.some(a=>norm(a.name).includes(want)));
    const pick=good||(qy===queries[0]?items[0]:null);
    if(pick){ ls.set(key,pick.uri); return pick.uri; }
  }
  return null;
}
const isMobile=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
async function listDevices(){
  const r=await api("GET","/me/player/devices");
  if(!r.ok) throw r;
  return r.json.devices||[];
}
/* ---------- Lecteur intégré (Web Playback SDK) ---------- */
const SDK_NAME="DJ Maison (ce navigateur)";
let sdkPlayer=null, sdkId=null, sdkErr="", sdkLoaded=false, lastSdk=false;
window.onSpotifyWebPlaybackSDKReady=()=>{ sdkLoaded=true; initSdk(); };
function initSdk(){
  if(sdkPlayer||!sdkLoaded||!window.Spotify||!connected()||!hasStreaming()) return;
  sdkPlayer=new Spotify.Player({name:SDK_NAME,getOAuthToken:cb=>{getToken().then(t=>cb(t||""))},volume:0.9});
  sdkPlayer.addListener("ready",({device_id})=>{sdkId=device_id;sdkErr="";refreshSdk()});
  sdkPlayer.addListener("not_ready",()=>{sdkId=null;refreshSdk()});
  sdkPlayer.addListener("initialization_error",({message})=>{sdkErr="Ce navigateur ne peut pas servir de lecteur ("+message+").";refreshSdk()});
  sdkPlayer.addListener("authentication_error",({message})=>{sdkErr="Autorisation refusée : déconnectez-vous puis reconnectez-vous ("+message+").";refreshSdk()});
  sdkPlayer.addListener("account_error",({message})=>{sdkErr="Compte non accepté pour le lecteur intégré ("+message+").";refreshSdk()});
  sdkPlayer.addListener("playback_error",({message})=>{sdkErr="Erreur de lecture ("+message+").";refreshSdk()});
  sdkPlayer.connect();
  refreshSdk();
}
function sdkStatus(){
  if(!connected()) return "";
  if(!hasStreaming()) return `<span class="msg bad">Lecteur intégré : autorisation manquante. Touchez « Se déconnecter », puis reconnectez-vous.</span>`;
  if(sdkErr) return `<span class="msg bad">Lecteur intégré : ${esc(sdkErr)}</span>`;
  if(sdkId) return `<span class="okline">● Lecteur intégré prêt : la musique sortira de cet écran.</span>`;
  return `<span class="muted small">Lecteur intégré : démarrage…</span>`;
}
function refreshSdk(){const el=document.getElementById("sdkstat"); if(el) el.innerHTML=sdkStatus();}
function unlockAudio(){
  try{ if(sdkPlayer&&sdkPlayer.activateElement) sdkPlayer.activateElement(); }catch(e){}
  try{ if(navigator.wakeLock&&!window._wl){ navigator.wakeLock.request("screen").then(l=>{window._wl=l;l.addEventListener("release",()=>{window._wl=null})}).catch(()=>{}); } }catch(e){}
}

async function pickDevice(){
  const saved=ls.get("sp_device");
  if(sdkId && (!saved || saved===SDK_NAME)) return {id:sdkId,name:SDK_NAME,type:"Lecteur intégré",is_active:false,sdk:true};
  const d=await listDevices();
  const want=isMobile?"Smartphone":"Computer";
  return (saved&&d.find(x=>x.name===saved))
    || d.find(x=>x.type===want&&x.is_active) || d.find(x=>x.type===want)
    || d.find(x=>x.is_active) || d[0] || null;
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function nowPlaying(){
  const r=await api("GET","/me/player");
  if(r.status===204||!r.ok||!r.json) return null;
  return r.json;
}
function errText(e){
  if(e instanceof Error) return "Erreur : "+e.message;
  const st=e.status, m=e.json?.error?.message||"", reason=e.json?.error?.reason||"";
  if(st===401) return "Connexion à Spotify expirée : reconnectez-vous depuis l'écran d'accueil.";
  if(st===403 && /restriction/i.test(m)) return "Spotify ne peut pas faire cette action maintenant (aucun titre en lecture ?).";
  if(st===403) return "Spotify refuse l'accès (403). Vérifiez que votre compte est inscrit dans « User Management ». "+m;
  if(st===404 || reason==="NO_ACTIVE_DEVICE") return "Aucun appareil Spotify actif. Ouvrez l'appli Spotify, lancez un titre, puis revenez.";
  if(st===429) return "Trop de demandes à Spotify : patientez quelques secondes.";
  return "Erreur Spotify "+st+(m?" : "+m:"");
}
async function playSong(artist,title){
  setMsg("Recherche du titre…");
  try{
    const uri=await findTrack(artist,title);
    if(!uri){ setMsg("Titre introuvable sur Spotify. Passez au suivant (bouton « Personne »).",true); return; }
    const dev=await pickDevice();
    if(!dev){ setMsg("Aucun appareil Spotify trouvé. Ouvrez l'appli Spotify, lancez un titre, puis revenez.",true); return; }
    if(!dev.is_active){
      setMsg("Réveil de Spotify sur "+dev.name+"…");
      await api("PUT","/me/player",{device_ids:[dev.id],play:false});
      await wait(800);
    }
    let np=null;
    lastSdk=!!dev.sdk;
    for(let essai=1; essai<=2; essai++){
      const p=await api("PUT","/me/player/play?device_id="+encodeURIComponent(dev.id),{uris:[uri]});
      if(!p.ok && p.status!==204) throw p;
      for(let k=0;k<3;k++){
        await wait(1200);
        np=await nowPlaying();
        if(np && np.is_playing){ setMsg("♪ Lecture sur : "+(np.device?.name||dev.name)); return; }
        if(k===1){ await api("PUT","/me/player/play?device_id="+encodeURIComponent(dev.id)); }
      }
    }
    const diag = np ? ("Spotify indique : appareil « "+(np.device?.name||"?")+" », lecture "+(np.is_playing?"en cours":"arrêtée")+".")
                    : "Spotify n'indique aucune lecture en cours.";
    showOpen(uri,"La musique ne démarre pas toute seule sur « "+dev.name+" » ("+dev.type+"). Touchez le bouton vert ci-dessous : Spotify s'ouvre sur le bon titre, lancez-le, puis revenez au jeu.");
  }catch(e){ setMsg(errText(e),true); }
}
async function cmd(path,okMsg,after){
  try{ const r=await api("PUT",path); if(!r.ok&&r.status!==204) throw r; setMsg(okMsg); if(after) after(); }
  catch(e){ setMsg(errText(e),true); }
}
function showOpen(uri,txt){
  setMsg(txt,true);
  const box=document.getElementById("openbox"); if(!box) return;
  const id=uri.split(":").pop();
  box.innerHTML=`<a class="spotlink" style="margin-top:4px" href="https://open.spotify.com/track/${id}" target="_blank" rel="noopener">Ouvrir ce titre dans Spotify</a>`;
}
function setMsg(t,bad){const el=document.getElementById("msg"); if(el){el.textContent=t; el.className="msg"+(bad?" bad":"")}}
let flash="";

/* ---------- État du jeu ---------- */
const KEY="djmaison-v1";
let S = load() || fresh();
function fresh(){return {screen:"setup",teams:[{n:"Équipe 1",sets:0},{n:"Équipe 2",sets:0}],played:[],theme:null,idx:0,revealed:false,pts:[]};}
function load(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function header(sub,spin){
  return `<div class="top ${spin?"spin":""}"><div class="vinyl" aria-hidden="true"></div><div><h1>DJ Maison</h1><div class="muted small">${sub}</div></div></div>`;
}
function scoreBoard(showPts){
  return `<div class="scores">${S.teams.map((t,i)=>`<div class="score"><b>${esc(t.n)}</b><span class="sets">${t.sets} set${t.sets>1?"s":""} / 2</span>${showPts?`<span class="pts">${S.pts[i]} pt${S.pts[i]>1?"s":""} sur ce thème</span>`:""}</div>`).join("")}</div>`;
}

function render(){save();({setup,pick,play,setEnd,gameEnd})[S.screen]();window.scrollTo(0,0)}

function setup(){
  const c=connected();
  app.innerHTML = header("Le quiz musical à thèmes, sur un seul téléphone")+`
  <div class="card">
    <span class="eyebrow">Spotify</span>
    ${c?`<span class="okline">● Connecté à Spotify</span>`:`<span class="muted">Connectez votre compte Spotify Premium pour que le jeu lance les titres.</span>`}
    ${flash?`<span class="msg${/chec|refus/.test(flash)?" bad":""}">${esc(flash)}</span>`:""}
    ${c?`<button class="ghost" id="logout">Se déconnecter</button>`:`<button class="spotbtn" id="login">Se connecter à Spotify</button>`}
    <span class="muted small">Avant de jouer : ouvrez Spotify sur l'appareil qui doit diffuser la musique, lancez n'importe quel titre, puis revenez ici.</span>
    <div id="sdkstat">${sdkStatus()}</div>
    ${c?`<span class="eyebrow">Appareil de lecture</span>
    <span class="small">Actuel : <b id="devname">${esc(ls.get("sp_device")||"automatique (lecteur intégré s'il est prêt)")}</b></span>
    <button class="ghost" id="devlist">Choisir l'appareil</button>
    <div class="teamlist" id="devs"></div>`:""}
  </div>
  <div class="card">
    <span class="eyebrow">Les équipes</span>
    <div class="teamlist">${S.teams.map((t,i)=>`<label class="small muted" for="team${i}">Équipe ${i+1}</label><input type="text" id="team${i}" value="${esc(t.n)}" maxlength="24">`).join("")}</div>
    <div class="row">
      <button id="add" ${S.teams.length>=4?"disabled":""}>+ Ajouter une équipe</button>
      <button id="rem" ${S.teams.length<=2?"disabled":""}>− Retirer</button>
    </div>
  </div>
  <div class="card">
    <span class="eyebrow">Règles</span>
    <ol class="rules">
      <li>Le DJ choisit un thème et l'annonce à voix haute.</li>
      <li>Il lance chaque titre. Les équipes cherchent le lien entre la chanson et le thème.</li>
      <li>Le premier joueur qui donne la bonne réponse marque 1 point pour son équipe et devient le DJ suivant.</li>
      <li>Après 7 titres, l'équipe qui a le plus de points gagne le set.</li>
      <li>La première équipe à 2 sets gagne la partie.</li>
    </ol>
    <p class="small muted" style="margin:0">Le titre de la chanson ne s'affiche pas : le DJ peut chercher avec son équipe. Attention seulement à la notification Spotify en haut de l'écran.</p>
  </div>
  <button class="primary" id="go" ${c?"":"disabled"}>Choisir un thème</button>`;
  flash="";
  const read=()=>S.teams.forEach((t,i)=>{const v=document.getElementById("team"+i).value.trim();t.n=v||("Équipe "+(i+1))});
  if(c) logout.onclick=()=>{spLogout();render()}; else login.onclick=()=>{read();save();spLogin()};
  if(c) devlist.onclick=async()=>{
    const box=document.getElementById("devs"); box.innerHTML='<span class="muted small">Recherche des appareils…</span>';
    try{
      const d=await listDevices();
      if(!d.length){box.innerHTML='<span class="msg bad">Aucun appareil trouvé. Ouvrez Spotify sur l\'appareil voulu, lancez un titre, puis réessayez.</span>';return;}
      box.innerHTML=`<button data-dev="">Automatique</button>`+d.map(x=>`<button data-dev="${esc(x.name)}">${esc(x.name)} <small class="muted">(${esc(x.type)}${x.is_active?", actif":""})</small></button>`).join("");
      box.querySelectorAll("[data-dev]").forEach(bt=>bt.onclick=()=>{const v=bt.dataset.dev; if(v)ls.set("sp_device",v); else ls.del("sp_device"); read(); render();});
    }catch(e){ box.innerHTML=`<span class="msg bad">${esc(errText(e))}</span>`; }
  };
  add.onclick=()=>{read();S.teams.push({n:"Équipe "+(S.teams.length+1),sets:0});render()};
  rem.onclick=()=>{read();S.teams.pop();render()};
  go.onclick=()=>{read();S.screen="pick";render()};
}

function pick(){
  const f=S.f||(S.f={pub:"",lang:"",dec:[]});
  f.dec=[];
  const ok=THEMES.map((t,i)=>i).filter(i=>themeMatch(THEMES[i],f));
  const left=ok.filter(i=>!S.played.includes(i));
  const chip=(grp,val,label,on)=>`<button class="chip${on?" on":""}" data-g="${grp}" data-v="${val}" aria-pressed="${on}">${label}</button>`;
  app.innerHTML = header("Choisissez le thème du prochain set")+scoreBoard(false)+`
  <div class="card">
    <span class="eyebrow">Filtres</span>
    <span class="small muted">Public</span>
    <div class="chips">${PUBS.map(p=>chip("pub",p[0],p[1],f.pub===p[0])).join("")}</div>
    <span class="small muted">Langue des chansons</span>
    <div class="chips">${chip("lang","","Toutes",!f.lang)}${chip("lang","fr","Surtout en français",f.lang==="fr")}${chip("lang","en","Surtout en anglais",f.lang==="en")}</div>
    <span class="small"><b>${ok.length}</b> thème${ok.length>1?"s":""} sur ${THEMES.length}${ok.length?", dont "+left.length+" pas encore joué"+(left.length>1?"s":""):""}.</span>
  </div>
  <button class="primary" id="rand" ${left.length?"":"disabled"}>Thème au hasard parmi la sélection</button>
  <div class="themes">${ok.map(i=>{const th=THEMES[i];return `<button data-i="${i}" class="${S.played.includes(i)?"played":""}">${esc(th.t)}<small>${th.span} · ${th.fr}/7 en français</small><small class="pubs">${th.pub.split("").map(k=>PUB_NAME[k]).join(" · ")}</small></button>`}).join("")||'<p class="muted">Aucun thème ne correspond. Retirez un filtre.</p>'}</div>
  <div class="row"><button class="ghost" id="back">Accueil et équipes</button><button class="ghost" id="resetp">Remettre les thèmes à zéro</button></div>`;
  app.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    const g=c.dataset.g,v=c.dataset.v;
    if(g==="dec"){ f.dec=f.dec.includes(v)?f.dec.filter(x=>x!==v):[...f.dec,v]; }
    else f[g]=v;
    render();
  });
  rand.onclick=()=>start(left[Math.floor(Math.random()*left.length)]);
  app.querySelectorAll(".themes button").forEach(b=>b.onclick=()=>start(+b.dataset.i));
  back.onclick=()=>{S.screen="setup";render()};
  resetp.onclick=()=>{S.played=[];render()};
}
function start(i){S.theme=i;S.idx=0;S.revealed=false;S.h=0;S.pts=S.teams.map(()=>0);S.screen="play";render()}

function play(){
  const th=THEMES[S.theme], [a,t,ans,why]=th.s[S.idx];
  app.innerHTML = header("Set en cours",true)+`
  <div class="card">
    <span class="eyebrow">Thème</span>
    <h2>${esc(th.t)}</h2>
    <div class="track" aria-label="Titre ${S.idx+1} sur 7">${th.s.map((_,k)=>`<span class="${k<S.idx?"done":k===S.idx?"now":""}"></span>`).join("")}</div>
    <span class="muted small">Titre ${S.idx+1} sur 7</span>
    <button class="spotbtn" id="playb">▶ Lancer le titre</button>
    <div class="row"><button id="pause">⏸ Pause</button><button id="resume">▶ Reprendre</button></div>
    <span class="msg" id="msg" aria-live="polite"></span>
    <div id="openbox"></div>
    <div class="hints" id="hints" aria-live="polite"></div>
    ${S.revealed?`
      <div class="answer">
        <span class="eyebrow">Réponse</span>
        <span class="big">${esc(ans)}</span>
        <span class="song">${esc(t)} — ${esc(a)}</span>
        <span class="muted small">${esc(why)}</span>
      </div>
      <span class="eyebrow">Qui a trouvé ?</span>
      <div class="row">${S.teams.map((tm,i)=>`<button class="primary" data-w="${i}">${esc(tm.n)}</button>`).join("")}</div>
      <button data-w="-1">Personne</button>
    `:`<button id="rev">Révéler la réponse</button>`}
  </div>
  ${scoreBoard(true)}
  <button class="ghost" id="quit">Abandonner ce thème</button>`;
  playb.onclick=()=>{ unlockAudio(); const ob=document.getElementById("openbox"); if(ob) ob.innerHTML=""; playSong(a,t); };
  pause.onclick=()=>{ if(lastSdk&&sdkPlayer){ sdkPlayer.pause().then(()=>setMsg("Pause.")); } else cmd("/me/player/pause","Pause."); };
  resume.onclick=()=>{ unlockAudio(); if(lastSdk&&sdkPlayer){ sdkPlayer.resume().then(()=>setMsg("♪ Lecture en cours")); } else cmd("/me/player/play","♪ Lecture en cours"); };
  if(!S.revealed) rev.onclick=()=>{S.revealed=true;render()};
  drawHints();
  app.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{
    const w=+b.dataset.w; if(w>=0)S.pts[w]++; S.h=0;
    api("PUT","/me/player/pause").catch(()=>{});
    if(S.idx<6){S.idx++;S.revealed=false}else{finishSet()}
    render();
  });
  quit.onclick=()=>{api("PUT","/me/player/pause").catch(()=>{});S.screen="pick";render()};
}

function finishSet(){
  if(!S.played.includes(S.theme))S.played.push(S.theme);
  const max=Math.max(...S.pts), win=S.pts.map((p,i)=>p===max?i:-1).filter(i=>i>=0);
  S.lastWin = (win.length===1 && max>0) ? win[0] : -1;
  if(S.lastWin>=0)S.teams[S.lastWin].sets++;
  S.screen = S.teams.some(t=>t.sets>=2) ? "gameEnd" : "setEnd";
}

function setEnd(){
  const w=S.lastWin;
  app.innerHTML = header("Fin du set")+`
  <div class="card center">
    <span class="eyebrow">${esc(THEMES[S.theme].t)}</span>
    ${w>=0?`<div class="win">${esc(S.teams[w].n)}</div><p style="margin:0">remporte la carte de ce thème.</p>`
          :`<div class="win">Égalité</div><p style="margin:0">Personne ne remporte ce set. Choisissez un autre thème pour départager.</p>`}
  </div>
  ${scoreBoard(true)}
  <button class="primary" id="next">Thème suivant</button>`;
  next.onclick=()=>{S.screen="pick";render()};
}

function gameEnd(){
  const w=S.teams.find(t=>t.sets>=2);
  app.innerHTML = header("Partie terminée")+`
  <div class="card center">
    <span class="eyebrow">Grand vainqueur du DJ set</span>
    <div class="win">${esc(w.n)}</div>
    <p class="muted" style="margin:0">2 sets remportés</p>
  </div>
  ${scoreBoard(false)}
  <button class="primary" id="again">Nouvelle partie, mêmes équipes</button>
  <button id="newteams">Nouvelle partie, nouvelles équipes</button>`;
  again.onclick=()=>{S.teams.forEach(t=>t.sets=0);S.screen="pick";render()};
  newteams.onclick=()=>{const p=S.played;S=fresh();S.played=p;render()};
}

spReturn().finally(()=>{ if(!connected() && S.screen!=="setup") S.screen="setup"; render(); initSdk(); });

</script>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>
</html>
